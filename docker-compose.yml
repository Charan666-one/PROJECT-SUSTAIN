version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: homoeo_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./docker/postgres/data:/var/lib/postgresql/data
      - ./scripts/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: homoeo_qdrant
    volumes:
      - ./docker/qdrant/data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"

  redis:
    image: redis:7-alpine
    container_name: homoeo_redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: homoeo_backend
    env_file: .env
    depends_on:
      - postgres
      - qdrant
      - redis
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./knowledge_base:/app/knowledge_base

  frontend:
    build: ./frontend
    container_name: homoeo_frontend
    env_file: .env
    depends_on:
      - backend
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    container_name: homoeo_nginx
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend

  celery_worker:
    build: ./backend
    container_name: homoeo_celery
    command: celery -A app.core.celery_app worker --loglevel=info
    env_file: .env
    depends_on:
      - redis
      - postgres
    volumes:
      - ./backend:/app

  celery_beat:
    build: ./backend
    container_name: homoeo_celery_beat
    command: celery -A app.core.celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      - redis
    volumes:
      - ./backend:/app
